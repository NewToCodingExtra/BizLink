<script type="text/plain" data-p="1" data-s="Service Provider" data-file="backend/app/Providers/FortifyServiceProvider.php (trimmed)" data-say="Fortify is headless: we point every auth view at a React page, plug in our actions, and bind custom responses.">
class FortifyServiceProvider extends ServiceProvider
{
    public function register(): void
    {
        // Custom redirects after login / register / logout / reset
        $this->app->singleton(LoginResponseContract::class, FortifyLoginResponse::class); @@
        $this->app->singleton(RegisterResponseContract::class, FortifyRegisterResponse::class);
        $this->app->singleton(LogoutResponseContract::class, FortifyLogoutResponse::class);
        // ... password reset responses
    }

    public function boot(): void
    {
        // Auth views are React pages rendered through Inertia
        Fortify::loginView(fn () => Inertia::render('Login')); @@
        Fortify::registerView(fn () => Inertia::render('Register')); @@
        Fortify::requestPasswordResetLinkView(fn () => Inertia::render('ForgotPassword'));
        Fortify::resetPasswordView(fn ($request) => Inertia::render('ResetPassword', [
            'email' => $request->email,
            'token' => $request->route('token'),
        ]));

        Fortify::createUsersUsing(CreateNewUser::class); @@
        Fortify::resetUserPasswordsUsing(ResetUserPassword::class);

        // Brute-force defence: 5 attempts / minute per email + IP
        RateLimiter::for('login', function (Request $request) {
            $throttleKey = Str::transliterate(Str::lower($request->input(Fortify::username())).'|'.$request->ip());

            return Limit::perMinute(5)->by($throttleKey); @@
        });

        Event::listen(Login::class, function (Login $event): void {
            request()->session()->put('last_activity_at', now());
            Preference::firstOrCreate(['user_id' => $event->user->id], ['categories' => []]);
        });
    }
}
</script>

<script type="text/plain" data-p="1" data-s="Auth Controller" data-file="backend/app/Http/Controllers/SessionAuthController.php" data-say="Login enforces a per-IP rate limiter from the Settings table, regenerates the session on success, and redirects role-aware via Spatie. Demo login maps a role param to seeded emails.">
<?php

namespace App\Http\Controllers;

use App\Models\Preference;
use App\Models\User;
use Illuminate\Http\Request;
use Illuminate\Support\Facades\Auth;
use Illuminate\Support\Facades\DB;
use Illuminate\Support\Facades\Hash;
use Illuminate\Support\Facades\Mail;
use Illuminate\Support\Facades\RateLimiter;
use Illuminate\Support\Str;
use Illuminate\Validation\ValidationException;
use Inertia\Inertia;

class SessionAuthController extends Controller
{
    public function showLogin()
    {
        return Inertia::render('Login'); @@
    }

    public function login(Request $request)
    {
        $data = $request->validate([
            'email' => 'required|email',
            'password' => 'required|string',
        ]);

        $ip = $request->ip();
        $rateLimitKey = 'login.attempts.' . $ip;
        $maxAttempts = (int) \App\Models\Setting::get('login_rate_limit', 5); @@

        if (RateLimiter::tooManyAttempts($rateLimitKey, $maxAttempts)) { @@
            $seconds = RateLimiter::availableIn($rateLimitKey);
            throw ValidationException::withMessages([
                'email' => ['Too many login attempts. Please try again in ' . $seconds . ' seconds.'],
            ]);
        }

        $userTarget = User::where('email', $data['email'])->first();

        if (!Auth::attempt(['email' => $data['email'], 'password' => $data['password']], true)) {
            RateLimiter::hit($rateLimitKey, 60); @@
            \App\Models\LoginAttempt::create([ @@
                'user_id' => $userTarget?->id,
                'email' => $data['email'],
                'ip' => $ip,
                'successful' => false,
                'user_agent' => $request->userAgent(),
                'created_at' => now(),
            ]);
            throw ValidationException::withMessages([
                'email' => ['The provided credentials are incorrect.'],
            ]);
        }

        RateLimiter::clear($rateLimitKey);

        \App\Models\LoginAttempt::create([ @@
            'user_id' => Auth::id(),
            'email' => $data['email'],
            'ip' => $ip,
            'successful' => true,
            'user_agent' => $request->userAgent(),
            'created_at' => now(),
        ]);

        $request->session()->regenerate(); @@
        $request->session()->put('last_activity_at', now()); @@

        Preference::firstOrCreate(['user_id' => Auth::id()], ['categories' => []]); @@

        // Land each role where its work starts. Admins → /admin, everyone else → /feed
        $user = Auth::user();

        return redirect()->intended($this->homeFor($user))->with('success', "Welcome back, {$user->name}!");
    }

    private function homeFor(User $user): string
    {
        if ($user->hasRole('Admin')) { @@
            return '/admin';
        }
        return '/feed';
    }

    public function demoLogin(Request $request)
    {
        $data = $request->validate([
            'role' => 'required|string|in:admin,brand,entrepreneur',
        ]);

        $map = [ @@
            'admin' => 'admin@bizlink.ph',
            'brand' => 'brand@bizlink.ph',
            'entrepreneur' => 'demo@bizlink.ph',
        ];
        $email = $map[$data['role']];

        $user = User::where('email', $email)->first();
        if (!$user) {
            throw ValidationException::withMessages([
                'role' => ['That demo account has not been seeded yet. Run php artisan db:seed.'],
            ]);
        }

        Auth::login($user, true); @@
        $request->session()->regenerate();
        $request->session()->put('last_activity_at', now());
        Preference::firstOrCreate(['user_id' => $user->id], ['categories' => []]);

        return redirect($this->homeFor($user))->with('success', "Signed in as {$user->name} ({$data['role']} demo).");
    }

    public function showRegister()
    {
        return Inertia::render('Register');
    }

    public function register(Request $request)
    {
        $data = $request->validate([
            'name' => 'required|string|max:255',
            'email' => 'required|string|email|max:255|unique:users',
            'password' => 'required|string|min:8|confirmed',
            'role' => 'sometimes|string|in:entrepreneur,brand,admin',
        ]);

        $user = User::create([
            'name' => $data['name'],
            'email' => $data['email'],
            'password' => Hash::make($data['password']), @@
            'role' => $data['role'] ?? 'entrepreneur',
            'avatar' => 'https://i.pravatar.cc/100?u=' . urlencode($data['email']),
        ]);
        $user->assignRole(($data['role'] ?? 'entrepreneur') === 'brand' ? 'Manager' : 'User'); @@

        Auth::login($user, true); @@
        $request->session()->regenerate();
        $request->session()->put('last_activity_at', now());

        Preference::firstOrCreate(['user_id' => $user->id], ['categories' => []]);

        return redirect('/feed')->with('success', "Welcome to BizLink, {$user->name}!");
    }

    public function logout(Request $request)
    {
        Auth::logout();
        $request->session()->invalidate();
        $request->session()->regenerateToken();

        return redirect('/')->with('success', 'Logged out.');
    }

    public function showForgot()
    {
        return Inertia::render('ForgotPassword');
    }

    public function sendResetLink(Request $request)
    {
        $data = $request->validate(['email' => 'required|email|max:255']);
        $user = User::where('email', $data['email'])->first();

        if ($user && !$user->google_id && !$user->facebook_id) {
            $token = Str::random(64); @@
            DB::table('password_reset_tokens')->updateOrInsert( @@
                ['email' => $user->email],
                ['token' => hash('sha256', $token), 'created_at' => now()]
            );
            Mail::raw( @@
                "Hi {$user->name},\n\nReset your BizLink password here:\n{$link}",
                function ($message) use ($user) {
                    $message->to($user->email)->subject('Reset your BizLink password');
                }
            );
        }

        return back()->with('success', 'If an account exists for this email, a reset link was sent.');
    }

    public function showReset(Request $request)
    {
        return Inertia::render('ResetPassword', [ @@
            'email' => $request->query('email', ''),
            'token' => $request->query('token', ''),
        ]);
    }

    public function reset(Request $request)
    {
        $data = $request->validate([
            'email' => 'required|email|max:255',
            'token' => 'required|string',
            'password' => 'required|string|min:8|confirmed',
        ]);

        $row = DB::table('password_reset_tokens')->where('email', $data['email'])->first(); @@

        if (!$row || !hash_equals($row->token, hash('sha256', $data['token']))) { @@
            throw ValidationException::withMessages([
                'email' => ['Invalid or expired reset token.'],
            ]);
        }

        if (now()->diffInMinutes($row->created_at) > 60) { @@
            DB::table('password_reset_tokens')->where('email', $data['email'])->delete();
            throw ValidationException::withMessages([
                'email' => ['Reset token expired. Request a new one.'],
            ]);
        }

        $user = User::where('email', $data['email'])->first();
        $user->forceFill(['password' => Hash::make($data['password'])])->save(); @@
        DB::table('password_reset_tokens')->where('email', $data['email'])->delete();
        $user->tokens()->delete();

        return redirect('/login')->with('success', 'Password reset. Log in with your new password.');
    }
}
</script>

<script type="text/plain" data-p="1" data-s="Session Guard" data-file="backend/app/Http/Middleware/CheckSessionActivity.php" data-say="Every 5 min the middleware refreshes online presence; every 7 days of inactivity it logs the user out to prevent stale sessions.">
<?php

namespace App\Http\Middleware;

use Closure;
use Illuminate\Http\Request;
use App\Models\Setting;
use Carbon\Carbon;
use Illuminate\Support\Facades\Auth;

class CheckSessionActivity
{
    public function handle(Request $request, Closure $next)
    {
        $user = $request->user();
        if ($user) {
            \Illuminate\Support\Facades\Cache::put("user-is-online-{$user->id}", true, now()->addMinutes(5)); @@
            \Illuminate\Support\Facades\Cache::put("user-last-seen-{$user->id}", now()->toIso8601String(), now()->addDays(30));
        }
        if ($user && $token = $user->currentAccessToken()) {
            $idleDays = Setting::get('session_idle_timeout_days', 7); @@

            if ($token->last_used_at && Carbon::parse($token->last_used_at)->diffInDays(now()) >= $idleDays) { @@
                $token->delete();
                return response()->json(['message' => 'Session expired due to inactivity. Please log in again.'], 401); @@
            }
            return $next($request);
        }

        // Session (browser) users: same inactivity policy, web-friendly logout.
        if ($user && $request->hasSession()) {
            $idleDays = Setting::get('session_idle_timeout_days', 7); @@
            $last = $request->session()->get('last_activity_at');

            if ($last && now()->diffInMinutes($last) > $idleDays * 24 * 60) { @@
                Auth::logout();
                $request->session()->invalidate();
                $request->session()->regenerateToken();
                return redirect('/login')->with('error', 'Session expired due to inactivity. Please log in again.');
            }

            $request->session()->put('last_activity_at', now());
        }

        return $next($request);
    }
}
</script>

<script type="text/plain" data-p="2" data-s="Suspension Middleware" data-file="backend/app/Http/Middleware/CheckSuspension.php" data-say="Suspended accounts can still browse read-only but cannot POST/PUT/PATCH/DELETE — they see the ban message on their next feed load. Reports stay available even when suspended.">
<?php

namespace App\Http\Middleware;

use App\Services\EnforcementService;
use Closure;
use Illuminate\Http\Request;

/**
 * Blocks suspended/banned accounts from mutating content.
 * Read-only browsing stays available so the ban message is visible.
 */
class CheckSuspension
{
    public function __construct(private EnforcementService $enforcement) {}

    public function handle(Request $request, Closure $next)
    {
        $user = $request->user();
        if ($user && in_array($request->method(), ['POST', 'PUT', 'PATCH', 'DELETE'], true)) { @@
            // Reporting itself must stay available even while suspended.
            if (! $request->is('*/report') && ! str_contains((string) $request->path(), 'report')) { @@
                if ($message = $this->enforcement->isBlocked($user)) { @@
                    if ($request->wantsJson() || $request->expectsJson()) {
                        return response()->json(['message' => $message], 403); @@
                    }
                    return redirect('/feed')->with('error', $message);
                }
            }
        }
        return $next($request);
    }
}
</script>

<script type="text/plain" data-p="2" data-s="Feed Scoring" data-file="backend/app/Services/OpportunityService.php (full scoring methods)" data-say="The feed ranker builds a single MySQL expression from weighted signals — followed author (+60), explicit category (+35), budget fit (+25/+10), implicit engagement (+20/+12), recency decay, engagement velocity, and verified trust (+3).">
private function scoreExpression(array $s): string
{
    $parts = [];

    // +60 followed author (relationship wins, like IG)
    // Author-exact: a follow means "this account", never "this slug",
    // so mislabeled brand_ids can't leak other authors' posts in.
    if (!empty($s['followedUserIds']) || !empty($s['followedRawSlugs'])) { @@
        $conds = [];
        if (!empty($s['followedUserIds'])) {
            $conds[] = 'user_id IN (' . implode(',', array_map('intval', $s['followedUserIds'])) . ')';
        }
        if (!empty($s['followedRawSlugs'])) {
            $conds[] = 'brand_id IN (' . implode(',', array_map($this->quote(), $s['followedRawSlugs'])) . ')';
        }
        $parts[] = 'IF(' . implode(' OR ', $conds) . ', 60, 0)';
    }

    // +35 explicit category match (normalized, like IG's interest topics).
    if (!empty($s['preferredCategoriesNorm'])) { @@
        $parts[] = 'IF(LOWER(TRIM(category)) IN (' . implode(',', array_map($this->quote(), $s['preferredCategoriesNorm'])) . '), 35, 0)';
    }

    // +25 budget fit / +10 near-miss (previously stored but never scored).
    $parts[] = $this->budgetExpression($s['budgetMin'], $s['budgetMax']); @@

    // +20 implicitly engaged brand (unconnected discovery).
    if (!empty($s['implicitUserIds']) || !empty($s['implicitSlugs'])) { @@
        $conds = [];
        if (!empty($s['implicitUserIds'])) {
            $conds[] = 'user_id IN (' . implode(',', array_map('intval', $s['implicitUserIds'])) . ')';
        }
        if (!empty($s['implicitSlugs'])) {
            $conds[] = 'brand_id IN (' . implode(',', array_map($this->quote(), $s['implicitSlugs'])) . ')';
        }
        $parts[] = 'IF(' . implode(' OR ', $conds) . ', 20, 0)';
    }

    // +12 implicitly engaged category.
    if (!empty($s['implicitCategoriesNorm'])) {
        $parts[] = 'IF(LOWER(TRIM(category)) IN (' . implode(',', array_map($this->quote(), $s['implicitCategoriesNorm'])) . '), 12, 0)';
    }

    // Recency decay: +15 fresh, fading to 0 after ~15 days (IG: fresh wins).
    $parts[] = 'GREATEST(0, 15 - TIMESTAMPDIFF(DAY, created_at, NOW()))';

    // Engagement velocity: likes/saves/comments so far (IG: how quickly
    // people engage). Capped so mega-posts can't dominate forever.
    $parts[] = 'LEAST(15, likes_count * 0.05 + saves_count * 0.1 + (SELECT COUNT(*) FROM comments WHERE comments.opportunity_id = opportunities.id AND comments.deleted_at IS NULL) * 0.5)'; @@

    // Trust: verified brands get a small boost (IG demotes problematic).
    $parts[] = 'IF(verified, 3, 0)'; @@

    return implode(' + ', $parts);
}

private function budgetExpression(?float $min, ?float $max): string
{
    if ($min === null && $max === null) {
        return '0';
    }
    // Numeric source of truth (backfilled from legacy "₱850K" strings).
    $cap = 'capital_amount';
    $hasCap = 'capital_amount IS NOT NULL';

    if ($min !== null && $max !== null) {
        [$lo, $hi] = $min <= $max ? [$min, $max] : [$max, $min];
        return "CASE WHEN NOT ({$hasCap}) THEN 0"
            . " WHEN {$cap} BETWEEN {$lo} AND {$hi} THEN 25"
            . " WHEN {$cap} BETWEEN " . ($lo * 0.7) . " AND " . ($hi * 1.3) . " THEN 10 ELSE 0 END";
    }
    if ($min !== null) {
        return "CASE WHEN NOT ({$hasCap}) THEN 0"
            . " WHEN {$cap} >= {$min} THEN 25"
            . " WHEN {$cap} >= " . ($min * 0.7) . " THEN 10 ELSE 0 END";
    }
    return "CASE WHEN NOT ({$hasCap}) THEN 0"
        . " WHEN {$cap} <= {$max} THEN 25"
        . " WHEN {$cap} <= " . ($max * 1.3) . " THEN 10 ELSE 0 END";
}
</script>

<script type="text/plain" data-p="2" data-s="Resource Shape" data-file="backend/app/Http/Resources/OpportunityResource.php" data-say="The API resource maps snake_case DB columns to camelCase JSON keys consumed by the React components, including computed booleans (liked/saved/preferred) and embedded author comments.">
<?php

namespace App\Http\Resources;

use Illuminate\Http\Resources\Json\JsonResource;

class OpportunityResource extends JsonResource
{
    public function toArray($request)
    {
        // NOTE: $this->additional is the resource's own meta bag (always
        // empty here). Per-item data attached by the controller lives on the
        // underlying model, so read it from there.
        $attached = ($this->resource instanceof \App\Models\Opportunity)
            ? ($this->resource->getAttribute('additional') ?? [])
            : [];
        $likedIds = $attached['likedIds'] ?? [];
        $savedIds = $attached['savedIds'] ?? [];
        $preferredIds = $attached['preferredIds'] ?? [];

        return [
            'id' => $this->id,
            'slug' => $this->slug ?: (string) $this->id,
            'user_id' => $this->user_id,
            'authorId' => $this->user_id, @@
            'authorUsername' => $this->relationLoaded('user') && $this->user ? $this->user->username : null,
            'user' => $this->relationLoaded('user') && $this->user ? [
                'id' => $this->user->id,
                'name' => $this->user->name,
                'username' => $this->user->username,
                'avatar' => $this->user->avatar,
                'role' => $this->user->role ?? null,
            ] : null,
            // Author account type for the role badge (brand vs entrepreneur).
            'authorRole' => $this->relationLoaded('user') && $this->user
                ? (in_array($this->user->role ?? 'entrepreneur', ['brand', 'admin'], true) ? 'brand' : 'entrepreneur')
                : null,
            'brandName' => $this->brand_name,
            'brandAvatar' => $this->brand_avatar,
            'brandId' => $this->brand_id,
            'type' => $this->type,
            'category' => $this->category,
            'headline' => $this->headline,
            'capitalRequired' => $this->capital_required,
            'capitalAmount' => $this->capital_amount !== null ? (int) $this->capital_amount : null, @@
            'roi' => $this->roi,
            'roiPercent' => $this->roi_percent !== null ? (float) $this->roi_percent : null,
            'description' => $this->description,
            'image' => $this->image,
            'mediaType' => $this->media_type,
            'videoUrl' => $this->video_url,
            'featured' => (bool) $this->featured,
            'verified' => (bool) $this->verified,
            'likes' => (int) $this->likes_count,
            'saves' => (int) $this->saves_count,
            'isNew' => (bool) $this->is_new,
            'liked' => in_array($this->id, $likedIds), @@
            'saved' => in_array($this->id, $savedIds), @@
            'preferred' => in_array($this->id, $preferredIds),
            'reasons' => $attached['reasons'] ?? [],
            'comments' => $this->relationLoaded('comments') ? $this->comments->map(fn($c) => [
                'id' => $c->id,
                'postId' => $c->opportunity_id,
                'parentId' => $c->parent_id,
                'userId' => $c->user_id,
                'username' => $c->relationLoaded('user') && $c->user ? $c->user->username : null,
                'author' => $c->author,
                'avatar' => $c->avatar,
                'text' => $c->text,
                'mediaUrl' => $c->media_url,
                'mediaType' => $c->media_type,
                'timestamp' => $c->created_at?->diffForHumans(),
                'isSellerReply' => (bool) $c->is_seller_reply,
                'edited' => $c->edited_at !== null,
                'deleted' => (bool) $c->trashed(),
                'reactions' => [],
                'myReaction' => null,
                'replies' => [],
                'repliesCount' => 0,
            ])->values() : [],
        ];
    }
}
</script>

export function setCsrfToken(token) {

export async function refreshCsrfToken() {

    const data = await res.json().catch(() => null);

export async function http(path, { method = 'GET', body, _retried = false } = {}) {

      Accept: 'application/json',

/**

export async function csrfFetch(path, { method = 'POST', formData, _retried = false } = {}) {

/**

<script type="text/plain" data-p="3" data-s="Layout Guard" data-file="frontend/src/Layouts/AppLayout.jsx" data-say="bfcache guard: Safari restores the previous DOM without a request, so pageshow with persisted=true forces a reload. Toast-once ref prevents duplicate flash toasts on client-side navigation.">
import { useEffect, useRef } from "react";

import Navbar from "../components/Navbar";

export default function AppLayout({ children }) {
  const page = usePage();
  const { flash } = page.props;
  const toast = useToast(); @@
  // Full-bleed canvases: no footer under the reels snap feed or the admin
  // console (both read stray footers as whitespace; admin stays desktop-first).
  const pathname = page.url.split("?")[0];
  const isDirectMessageThread = pathname.startsWith("/messages/") && pathname !== "/messages";
  const isReels = pathname.startsWith("/reels");
  const hideFooter = isReels || pathname.startsWith("/admin") || pathname.startsWith("/messages");
  const hideBottomNav = isDirectMessageThread || pathname.startsWith("/admin");
  const mainPadding = (isDirectMessageThread || isReels)
    ? "pb-0"
    : "pb-24 md:pb-[max(1rem,env(safe-area-inset-bottom))]";
  // Toast-once guard: flash props persist across client-side visits and the
  // toast object is referentially unstable, so neither seen-state nor the
  // effect deps alone prevent repeats. Ref records the last toasted key.
  const lastToasted = useRef(null); @@
  const toastRef = useRef(null);

  // Back/forward cache guard: Safari restores the previous DOM without a
  // request, showing whoever was logged in before. Reload forces fresh auth.
  useEffect(() => { @@
    const onPageShow = (e) => {
      if (e.persisted) window.location.reload(); @@
    };
    window.addEventListener("pageshow", onPageShow);
    return () => window.removeEventListener("pageshow", onPageShow);
  }, []);

  // Server flash messages (redirects) surface as toasts, once each.
  useEffect(() => {
    toastRef.current = toast;
    const key = `${flash?.success || ""}|${flash?.error || ""}`;
    if (!key || key === "|" || lastToasted.current === key) return; @@
    lastToasted.current = key;
    if (flash?.success) toastRef.current.success(flash.success);
    if (flash?.error) toastRef.current.error(flash.error); @@
  }, [toast, flash]);

  return (
    <div className="min-h-dvh bg-[var(--color-bg)] text-[var(--color-text-primary)] flex flex-col overflow-x-clip">
      <a
        href="#main-content"

      <Navbar /> @@
      <main id="main-content" className={`flex-1 min-w-0 ${mainPadding}`}>{children}</main>
      {!hideBottomNav && <BottomNav />}
      {!hideFooter && <Footer />}
      <GlobalModals />
