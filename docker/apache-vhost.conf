# $PORT is templated by entrypoint.sh (Railway injects it; defaults to 80).
<VirtualHost *:${APACHE_PORT}>
    ServerName localhost
    DocumentRoot /var/www/html/backend/public

    <Directory /var/www/html/backend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Reverb websockets share this domain: wss://<host>/app/<key>
    # proxies to the internal Reverb server (supervisor, 127.0.0.1:8080).
    # Browsers only ever speak TLS 443; plain ws never leaves the container.
    ProxyPreserveHost On
    ProxyPass /app ws://127.0.0.1:8080/app
    ProxyPassReverse /app ws://127.0.0.1:8080/app

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
