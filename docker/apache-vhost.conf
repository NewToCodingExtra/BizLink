# $PORT is templated by entrypoint.sh (Railway injects it; defaults to 80).
<VirtualHost *:${APACHE_PORT}>
    ServerName localhost
    DocumentRoot /var/www/html/backend/public

    <Directory /var/www/html/backend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Reverb websockets and HTTP endpoints share this domain: wss://<host>/app/<key>
    # proxies to internal Reverb server on dedicated port 8085 (avoids collision with Railway's $PORT=8080).
    ProxyPreserveHost On
    ProxyRequests Off

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:8085/$1 [P,L]

    ProxyPass /app ws://127.0.0.1:8085/app
    ProxyPassReverse /app ws://127.0.0.1:8085/app
    ProxyPass /apps http://127.0.0.1:8085/apps
    ProxyPassReverse /apps http://127.0.0.1:8085/apps

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
